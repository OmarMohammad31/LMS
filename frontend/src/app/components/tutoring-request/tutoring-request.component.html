<div style="max-width:700px;margin:30px auto;font-family:Arial,sans-serif;">

  <h2>Create Tutoring Request</h2>

  <div style="margin-bottom:20px;">

    <input
      type="text"
      [(ngModel)]="topic"
      placeholder="Enter tutoring topic"
      style="width:70%;padding:10px;margin-right:10px;border:1px solid #ccc;border-radius:5px;">

    <button
      (click)="createRequest()"
      [disabled]="loading"
      style="padding:10px 20px;background:#3498db;color:white;border:none;border-radius:5px;cursor:pointer;">

      {{ loading ? 'Creating...' : 'Create Request' }}

    </button>

  </div>

  <hr>

  <h2>Available Tutoring Requests</h2>

  <div *ngIf="requests.length === 0">
    <p>No tutoring requests available.</p>
  </div>

  <table
    *ngIf="requests.length > 0"
    border="1"
    cellpadding="10"
    cellspacing="0"
    width="100%"
    style="border-collapse:collapse;">

    <thead style="background:#3498db;color:white;">
      <tr>
        <th>Topic</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let request of requests">
        <td>{{ request.topic }}</td>
        <td>{{ request.status }}</td>
      </tr>
    </tbody>

  </table>

</div>
