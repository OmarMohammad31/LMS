<div class="dashboard-page">
  <h2>Dashboard</h2>

  <app-loading-spinner *ngIf="loading" message="Loading your profile..."></app-loading-spinner>

  <div *ngIf="!loading && userProfile" class="profile-card">
    <h3>Welcome, {{ userProfile.name }}!</h3>
    <p><strong>Email:</strong> {{ userProfile.email }}</p>
    <p><strong>Role:</strong> {{ userProfile.isInstructor ? 'Instructor' : 'Student' }}</p>
    <p><strong>Credit Balance:</strong> {{ userProfile.creditBalance }} credits</p>
    <button (click)="logout()" class="btn btn--danger">Logout</button>
  </div>

  <p *ngIf="errorMsg" class="error-text">{{ errorMsg }}</p>
</div>
