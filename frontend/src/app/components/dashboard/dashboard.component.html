<div style="max-width: 500px; margin: 0 auto; font-family: sans-serif;">
  <h2>Dashboard</h2>

  <div *ngIf="loading">
    <p>Loading your profile...</p>
  </div>

  <div *ngIf="!loading && userProfile" style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; background-color: #f9f9f9;">
    <h3>Welcome, {{ userProfile.name }}! 👋</h3>
    <p><strong>Email:</strong> {{ userProfile.email }}</p>
    <p><strong>Role:</strong> {{ userProfile.isInstructor ? 'Instructor' : 'Student' }}</p>
    <p><strong>Credit Balance:</strong> {{ userProfile.creditBalance }} credits</p>

    <button (click)="logout()" style="margin-top: 15px; padding: 8px 16px; background-color: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Logout
    </button>
  </div>

  <div *ngIf="errorMsg">
    <p style="color: red;">{{ errorMsg }}</p>
  </div>
</div>
