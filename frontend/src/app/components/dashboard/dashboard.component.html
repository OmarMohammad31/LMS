<div style="max-width: 600px; margin: 0 auto; font-family: sans-serif;">
  <h2>Dashboard</h2>

  <div *ngIf="loading">
    <p>Loading your profile...</p>
  </div>

  <div *ngIf="!loading && userProfile"
       style="border: 1px solid #ccc; padding: 20px; border-radius: 8px; background-color: #f9f9f9;">

    <h3>Welcome, {{ userProfile.name }}! 👋</h3>

    <p><strong>Email:</strong> {{ userProfile.email }}</p>
    <p><strong>Role:</strong> {{ userProfile.isInstructor ? 'Instructor' : 'Student' }}</p>
    <p><strong>Credit Balance:</strong> {{ userProfile.creditBalance }} credits</p>

    <div style="margin-top:20px;">

      <a
        routerLink="/tutoring-request"
        style="display:inline-block; margin-right:10px; padding:10px 20px; background:#3498db; color:white; text-decoration:none; border-radius:5px;">
        Create Tutoring Request
      </a>

      <a
        routerLink="/accept-requests"
        style="display:inline-block; margin-right:10px; padding:10px 20px; background:#27ae60; color:white; text-decoration:none; border-radius:5px;">
        Accept Requests
      </a>

      <button
        (click)="logout()"
        style="margin-top:10px; padding:10px 20px; background:#e74c3c; color:white; border:none; border-radius:5px; cursor:pointer;">
        Logout
      </button>

    </div>

  </div>

  <div *ngIf="errorMsg">
    <p style="color:red;">{{ errorMsg }}</p>
  </div>
</div>
