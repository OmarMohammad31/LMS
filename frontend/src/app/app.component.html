<div class="app-shell">
  <header class="app-header">
    <h1 class="app-header__title">LMS Portal</h1>

    <nav class="app-nav" *ngIf="!authService.isLoggedIn()">
      <a routerLink="/login" class="app-nav__link">Login</a>
      <a routerLink="/register" class="app-nav__link">Register</a>
    </nav>

    <nav class="app-nav" *ngIf="authService.isLoggedIn()">
      <app-credit-balance></app-credit-balance>

      <button class="app-nav__menu-toggle" (click)="menuOpen = !menuOpen">
        Menu
      </button>

      <div class="app-nav__menu" [class.app-nav__menu--open]="menuOpen">
        <a routerLink="/dashboard" class="app-nav__link" (click)="menuOpen = false">Dashboard</a>
        <a routerLink="/sessions" class="app-nav__link" (click)="menuOpen = false">Sessions</a>
        <a routerLink="/tutoring/new" class="app-nav__link" (click)="menuOpen = false">Request Tutoring</a>
        <a routerLink="/tutoring/open" class="app-nav__link" (click)="menuOpen = false">Accept Requests</a>
        <a routerLink="/tutoring/mine" class="app-nav__link" (click)="menuOpen = false">My Requests</a>
        <a routerLink="/debug/users" class="app-nav__link app-nav__link--debug" (click)="menuOpen = false">Debug: Users</a>
        <button (click)="logout()" class="app-nav__link app-nav__link--button">Logout</button>
      </div>
    </nav>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <app-toast></app-toast>
</div>
