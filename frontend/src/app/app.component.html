<div class="app-shell">
  <header class="app-header">
    <h1 class="app-header__title">LMS Portal</h1>
    <nav class="app-nav">
      <ng-container *ngIf="!authService.isLoggedIn()">
        <a routerLink="/login" class="app-nav__link">Login</a>
        <a routerLink="/register" class="app-nav__link">Register</a>
      </ng-container>
      <ng-container *ngIf="authService.isLoggedIn()">
        <a routerLink="/dashboard" class="app-nav__link">Dashboard</a>
        <button (click)="logout()" class="app-nav__link app-nav__link--button">Logout</button>
      </ng-container>
    </nav>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <app-toast></app-toast>
</div>
